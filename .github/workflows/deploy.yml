name: Deploy FastAPI App V2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug - Show build context
        run: |
          echo "=== Current directory ==="
          pwd
          echo ""
          echo "=== Files in repo root ==="
          ls -la
          echo ""
          echo "=== .dockerignore contents ==="
          cat .dockerignore 2>/dev/null || echo "No .dockerignore found"
          echo ""
          echo "=== Docker build context will include ==="
          find . -type f ! -path './.git/*' ! -path './.venv/*' ! -path './__pycache__/*' | sort

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3    
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}    
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-pratice-v2:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-pratice-v2:${{ github.sha }}

      - name: Copy compose files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            source: "docker-compose.yml,nginx.conf"
            target: "~/fastapi-app-v2/"

      - name: Deploy to EC2 with Docker Compose
        uses: appleboy/ssh-action@v1.2.2
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
                set -eu

                cd ~/fastapi-app-v2

                # docker compose substitutes ${DOCKERHUB_USERNAME} and ${IMAGE_TAG} from .env
                printf 'DOCKERHUB_USERNAME=%s\nIMAGE_TAG=%s\n' '${{ secrets.DOCKERHUB_USERNAME }}' '${{ github.sha }}' > .env

                echo "=== Deploy directory ==="
                ls -la

                if ! sudo docker compose version >/dev/null 2>&1; then
                  echo "ERROR: Docker Compose plugin is not installed on EC2."
                  echo "Install it with: sudo apt-get update && sudo apt-get install -y docker-compose-plugin"
                  exit 1
                fi

                echo "=== Resolved compose config ==="
                sudo docker compose config

                echo "=== Docker images on EC2 (before pull) ==="
                sudo docker images
                echo "=== Running containers (before) ==="
                sudo docker ps -a

                echo "=== Pulling images ==="
                sudo docker compose pull

                echo "=== Starting services ==="
                sudo docker compose up -d --remove-orphans

                sleep 5
                sudo docker inspect --format='{{.State.Running}}' fastapi-app-v2 | grep -qx true
                sudo docker inspect --format='{{.State.Running}}' nginx-server-v2 | grep -qx true

                echo "=== Running containers (after) ==="
                sudo docker compose ps

                echo "=== Health check via nginx (port 7070) ==="
                curl -fsS http://localhost:7070/ || {
                  echo "--- app logs ---"
                  sudo docker logs fastapi-app-v2 --tail 50
                  echo "--- nginx logs ---"
                  sudo docker logs nginx-server-v2 --tail 50
                  exit 1
                }

                echo "=== Pruning dangling images ==="
                sudo docker image prune -f

                echo "Deployment successful"