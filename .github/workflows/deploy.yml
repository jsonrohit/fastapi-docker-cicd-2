name: Deploy FastAPI App V2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug - Show build context
        run: |
          echo "=== Current directory ==="
          pwd
          echo ""
          echo "=== Files in repo root ==="
          ls -la
          echo ""
          echo "=== .dockerignore contents ==="
          cat .dockerignore 2>/dev/null || echo "No .dockerignore found"
          echo ""
          echo "=== Docker build context will include ==="
          find . -type f ! -path './.git/*' ! -path './.venv/*' ! -path './__pycache__/*' | sort

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3    
      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}    
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-pratice-v2:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-pratice-v2:${{ github.sha }}
      
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
                set -eu    
                echo "=== EC2 current dir ==="
                pwd
                echo "=== Docker images on EC2 (before pull) ==="
                sudo docker images
                echo "=== Running containers (before) ==="
                sudo docker ps -a    
                sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-pratice-v2:${{ github.sha }}    
                sudo docker stop fastapi-app || true
                sudo docker rm fastapi-app || true    
                sudo docker run -d \
                    --name fastapi-app \
                    --restart unless-stopped \
                    -p 8000:8000 \
                    ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-pratice-v2:${{ github.sha }}    
                sleep 5
                sudo docker inspect --format='{{.State.Running}}' fastapi-app | grep -qx true
                echo "=== Running containers (after) ==="
                sudo docker ps
                echo "=== App files inside container ==="
                sudo docker exec fastapi-app ls -la /app
                echo "=== Physical location of image files on EC2 disk ==="
                IMAGE_ID=$(sudo docker inspect --format '{{.Image}}' fastapi-app)
                sudo docker inspect "$IMAGE_ID" --format 'UpperDir: {{index .GraphDriver.Data "UpperDir"}}' || \
                    echo "Storage driver: $(sudo docker info --format '{{.Driver}}') — image stored under /var/lib/docker/"
                echo "Deployment successful"