services:
  app:
    build: .
    image: ${DOCKERHUB_USERNAME:-local}/fastapi-pratice-v2:${IMAGE_TAG:-latest}
    container_name: fastapi-app
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx-server
    ports:
      - "70:70"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped